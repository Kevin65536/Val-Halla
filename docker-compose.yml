# Optional WebUI-only deployment; desktop users should run Start.cmd.
# Use runtime.mode: external and a OneBot endpoint reachable from this container.
services:
  valhalla:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./export:/app/export
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
